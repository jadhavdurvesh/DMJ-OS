name: Build DMJ OS ISO

on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename"
        required: false
        default: "Ashen"

  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gettext \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-common \
            wget \
            rsync \
            cpio \
            bzip2 \
            xz-utils \
            gzip

      - name: Install current Debian Live build tools
        run: |
          set -euxo pipefail

          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build
          sudo make install

          export PATH="/usr/local/bin:$PATH"
          hash -r

          echo "Using live-build from: $(command -v lb)"
          lb --version

      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh

      - name: Run DMJ OS build
        run: |
          set -euxo pipefail
          export PATH="/usr/local/bin:$PATH"

          echo "Checking build directory..."
          ls -la ./build/
          echo "Using live-build from: $(command -v lb)"
          lb --version

          chmod +x ./build/build-dmj-os.sh
          sudo env PATH="$PATH" bash ./build/build-dmj-os.sh

      - name: Check ISO output
        run: |
          echo "Checking generated ISO..."
          ls -lah ./out/

          if ! find ./out -type f -name "*.iso" -print -quit | grep -q .; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Ashen' }}
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
