name: Build DMJ OS ISO

on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename"
        required: false
        default: "Ashen"
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "base"
        options:
          - base
          - macos-deluxe

  push:
    branches:
      - main
    paths:
      - "build/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gettext \
            po4a \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-common \
            wget \
            rsync \
            cpio \
            bzip2 \
            xz-utils \
            gzip \
            ffmpeg

      - name: Install current Debian Live build tools
        run: |
          set -euxo pipefail

          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build
          sudo make install

          export PATH="/usr/local/bin:$PATH"
          hash -r

          echo "Using live-build from: $(command -v lb)"
          lb --version

      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh

      - name: Run DMJ OS build
        env:
          BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.variant || 'base' }}
        run: |
          set -euxo pipefail
          export PATH="/usr/local/bin:$PATH"

          if [[ "$BUILD_VARIANT" == "macos-deluxe" ]]; then
            export INCLUDE_MACOS_THEME=true
            export INCLUDE_WALLPAPER=true
            export INCLUDE_WELCOME_SCREEN=true
            export INCLUDE_DESKTOP_APPS=true
          fi

          echo "Checking build directory..."
          ls -la ./build/
          echo "Using live-build from: $(command -v lb)"
          lb --version

          chmod +x ./build/build-dmj-os.sh
          sudo env \
            PATH="$PATH" \
            INCLUDE_MACOS_THEME="${INCLUDE_MACOS_THEME:-false}" \
            INCLUDE_WALLPAPER="${INCLUDE_WALLPAPER:-false}" \
            INCLUDE_WELCOME_SCREEN="${INCLUDE_WELCOME_SCREEN:-false}" \
            INCLUDE_DESKTOP_APPS="${INCLUDE_DESKTOP_APPS:-false}" \
            bash ./build/build-dmj-os.sh

      - name: Check ISO output
        run: |
          echo "Checking generated ISO..."
          ls -lah ./out/

          if ! find ./out -type f -name "*.iso" -print -quit | grep -q .; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

      - name: Capture boot video + screenshots
        # Boots the ISO headlessly in QEMU, samples the framebuffer every
        # few seconds throughout boot, and assembles those frames into an
        # actual MP4 — plus saves a few named milestone stills — so there's
        # visual proof of the Plymouth splash and boot progression without
        # needing a display or any interactivity. Never fails the whole
        # workflow: if this step has trouble, the ISO itself (uploaded
        # separately below) is still the source of truth.
        continue-on-error: true
        run: |
          set -euxo pipefail
          sudo apt-get install -y qemu-system-x86 qemu-utils
          pip install --break-system-packages --quiet pillow

          ISO_FILE="$(find ./out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          mkdir -p boot-preview
          # 240s window, 3s between frames (~80 frames) — long enough to
          # cover GRUB -> Plymouth -> hopefully desktop under non-KVM
          # emulation without making the artifact huge.
          python3 tools/qemu-preview/capture_boot_screenshots.py "$ISO_FILE" boot-preview 240 3

      - name: Upload boot video + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Ashen' }}${{ (inputs.variant == 'macos-deluxe' && '-macos') || '' }}-boot-preview
          path: |
            boot-preview/boot_video.mp4
            boot-preview/milestone_*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Ashen' }}${{ (inputs.variant == 'macos-deluxe' && '-macos') || '' }}
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
