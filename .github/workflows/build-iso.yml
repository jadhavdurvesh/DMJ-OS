name: Build DMJ OS ISO

# Trigger manually, or automatically when relevant DMJ OS files change
on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename"
        required: false
        default: "Ashen"

  push:
    branches:
      - main
    paths:
      - "build/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install build dependencies
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            live-build \
            python3-pip

      # Set release codename when manually triggered
      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh

      # Build DMJ OS
      - name: Run DMJ OS build
        run: |
          echo "Checking build directory..."
          ls -la ./build/

          echo "Making build script executable..."
          chmod +x ./build/build-dmj-os.sh

          echo "Starting DMJ OS build..."
          sudo bash ./build/build-dmj-os.sh

      # Check build output
      - name: Check ISO output
        run: |
          echo "Checking generated ISO..."
          ls -lh ./out/ || true

      # Upload the finished ISO
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-iso
          path: out/*.iso
          retention-days: 14
          if-no-files-found: error
