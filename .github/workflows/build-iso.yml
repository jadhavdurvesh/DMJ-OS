name: Build DMJ OS ISO

on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename"
        required: false
        default: "Genesis"
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "base"
        options:
          - base
          - macos-deluxe

  push:
    branches:
      - main
    paths:
      - "build/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            gettext \
            po4a \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-common \
            wget \
            rsync \
            cpio \
            bzip2 \
            xz-utils \
            gzip \
            ffmpeg

      - name: Install current Debian Live build tools
        run: |
          set -euxo pipefail

          git clone --depth 1 https://salsa.debian.org/live-team/live-build.git /tmp/live-build
          cd /tmp/live-build
          sudo make install

          export PATH="/usr/local/bin:$PATH"
          hash -r

          echo "Using live-build from: $(command -v lb)"
          lb --version

      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh

      - name: Run DMJ OS build
        env:
          BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.variant || 'base' }}
        run: |
          set -euxo pipefail
          export PATH="/usr/local/bin:$PATH"

          if [[ "$BUILD_VARIANT" == "macos-deluxe" ]]; then
            export INCLUDE_MACOS_THEME=true
            export INCLUDE_WALLPAPER=true
            export INCLUDE_WELCOME_SCREEN=true
            export INCLUDE_DESKTOP_APPS=true
          fi

          echo "Checking build directory..."
          ls -la ./build/
          echo "Using live-build from: $(command -v lb)"
          lb --version

          chmod +x ./build/build-dmj-os.sh
          sudo env \
            PATH="$PATH" \
            INCLUDE_PLYMOUTH_THEME="${INCLUDE_PLYMOUTH_THEME:-true}" \
            INCLUDE_SYSTEM_BRANDING="${INCLUDE_SYSTEM_BRANDING:-true}" \
            INCLUDE_MACOS_THEME="${INCLUDE_MACOS_THEME:-false}" \
            INCLUDE_WALLPAPER="${INCLUDE_WALLPAPER:-false}" \
            INCLUDE_WELCOME_SCREEN="${INCLUDE_WELCOME_SCREEN:-true}" \
            INCLUDE_DESKTOP_APPS="${INCLUDE_DESKTOP_APPS:-false}" \
            bash ./build/build-dmj-os.sh

      - name: Check ISO output
        run: |
          echo "Checking generated ISO..."
          ls -lah ./out/

          if ! find ./out -type f -name "*.iso" -print -quit | grep -q .; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

      - name: Capture graphical boot video + screenshots
        # Use a real virtual X display so QEMU exercises its graphical
        # framebuffer/display path. The previous -display none setup could
        # produce a technically valid screendump while not faithfully
        # representing what a user sees during GRUB/Plymouth/XFCE startup.
        # Everything remains inside GitHub Actions; no local machine is
        # involved. The capture step is non-blocking for ISO publication.
        continue-on-error: true
        run: |
          set -euxo pipefail
          sudo apt-get install -y qemu-system-x86 qemu-utils xvfb
          pip install --break-system-packages --quiet pillow

          ISO_FILE="$(find ./out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          mkdir -p boot-preview

          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac +extension GLX +render -noreset >/tmp/dmj-xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2

          # 120 seconds sampled every second. The one-second cadence is
          # deliberate: the DMJ Cinematic logo reveal happens in the first
          # few seconds and a three-second cadence can skip it entirely.
          python3 tools/qemu-preview/capture_boot_screenshots.py "$ISO_FILE" boot-preview 120 1

      - name: Upload boot video + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Genesis' }}${{ (inputs.variant == 'macos-deluxe' && '-macos') || '' }}-boot-preview
          path: |
            boot-preview/boot_video.mp4
            boot-preview/boot_video_boosted.mp4
            boot-preview/milestone_*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Genesis' }}${{ (inputs.variant == 'macos-deluxe' && '-macos') || '' }}
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
