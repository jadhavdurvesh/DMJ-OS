name: Build DMJ OS ISO

# Run manually from the Actions tab, or automatically when important
# DMJ OS files are pushed to the main branch.
on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename (e.g. Ashen)"
        required: false
        default: "Ashen"

  push:
    branches:
      - main
    paths:
      - "config/**"
      - "build/**"
      - "dmj-ai-assets/**"
      - ".github/workflows/**"

jobs:
  build-iso:
    runs-on: ubuntu-latest

    # Prevent a build from running forever.
    timeout-minutes: 90

    steps:

      # -------------------------------
      # CHECKOUT REPOSITORY
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required if large files are tracked using Git LFS.
          lfs: true


      # -------------------------------
      # INSTALL BUILD TOOLS
      # -------------------------------
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            live-build \
            python3-pip

          pip install --break-system-packages pillow


      # -------------------------------
      # GENERATE PLYMOUTH ASSETS
      # -------------------------------
      - name: Regenerate Plymouth theme assets
        working-directory: config/plymouth/dmj-cinematic
        run: |
          python3 generate_assets.py


      # -------------------------------
      # OPTIONAL SAUDADE AI MODEL
      # -------------------------------
      - name: Stage Saudade checkpoint into build assets
        run: |
          mkdir -p dmj-ai-assets

          echo "Checking for optional Saudade AI assets..."

          # Only copy the checkpoint if it exists.
          if [ -f "saudade_v4.pt" ]; then
            cp saudade_v4.pt dmj-ai-assets/saudade_v4.pt
            echo "✓ Saudade checkpoint copied."
          else
            echo "⚠ Saudade checkpoint not found — skipping."
          fi

          # Only copy the tokenizer if it exists.
          if [ -f "tokenizer_32k.json" ]; then
            cp tokenizer_32k.json dmj-ai-assets/tokenizer_32k.json
            echo "✓ Tokenizer copied."
          else
            echo "⚠ Tokenizer not found — skipping."
          fi


      # -------------------------------
      # SET RELEASE CODENAME
      # -------------------------------
      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh


      # -------------------------------
      # BUILD DMJ OS
      # -------------------------------
      - name: Run DMJ OS build
        run: |
          sudo ./build/build-dmj-os.sh


      # -------------------------------
      # UPLOAD FINAL ISO
      # -------------------------------
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-iso
          path: out/*.iso
          retention-days: 14
