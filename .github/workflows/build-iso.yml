name: Build DMJ OS ISO

on:
  workflow_dispatch:
    inputs:
      version_codename:
        description: "Release codename"
        required: false
        default: "Ashen"

  push:
    branches:
      - main
    paths:
      - "build/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            live-build \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-common

      - name: Set release codename
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i \
            "s/^VERSION_CODENAME=.*/VERSION_CODENAME=\"${{ github.event.inputs.version_codename }}\"/" \
            build/build-dmj-os.sh

      - name: Run DMJ OS build
        run: |
          echo "Checking build directory..."
          ls -la ./build/

          chmod +x ./build/build-dmj-os.sh
          sudo bash ./build/build-dmj-os.sh

      - name: Check ISO output
        run: |
          echo "Checking generated ISO..."
          ls -lah ./out/

          if ! find ./out -type f -name "*.iso" -print -quit | grep -q .; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmj-os-${{ inputs.version_codename || 'Ashen' }}
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
